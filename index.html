<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>塔罗人格牌 · 你隐藏的灵魂底色</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --deep:#1a1520;
  --midnight:#2a1f35;
  --plum:#3d2a4a;
  --cream:#faf6f0;
  --parchment:#f5ede0;
  --ink:#3a322a;
  --ink-light:#6b5e52;
  --gold:#c9a96e;
  --gold-light:#e8d5a8;
  --gold-bright:#dfbc6e;
  --rose:#c47a8a;
  --rose-deep:#9e6b7b;
  --sage:#7a8c6e;
  --mauve:#b8a0c4;
  --shadow-gold:rgba(201,169,110,.2);
}

html{font-size:16px;-webkit-tap-highlight-color:transparent;height:100%}
body{
  font-family:'Noto Serif SC','ZCOOL XiaoWei',Georgia,serif;
  background:var(--deep);
  color:var(--cream);
  min-height:100dvh;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}

/* ——— Animated Starfield Background ——— */
.stars-canvas{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}

/* ——— Ambient Glow Orbs ——— */
.ambient-orb{
  position:fixed;border-radius:50%;z-index:0;pointer-events:none;
  filter:blur(80px);opacity:.25;
}
.orb-1{
  width:320px;height:320px;
  background:radial-gradient(circle,rgba(201,169,110,.5),transparent);
  top:10%;left:-80px;
  animation: orbPulse1 8s ease-in-out infinite;
}
.orb-2{
  width:240px;height:240px;
  background:radial-gradient(circle,rgba(196,122,138,.4),transparent);
  bottom:15%;right:-60px;
  animation: orbPulse2 10s ease-in-out infinite;
}
.orb-3{
  width:200px;height:200px;
  background:radial-gradient(circle,rgba(184,160,196,.3),transparent);
  top:50%;left:50%;
  animation: orbPulse3 12s ease-in-out infinite;
}
@keyframes orbPulse1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.15)}}
@keyframes orbPulse2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-25px,15px) scale(1.1)}}
@keyframes orbPulse3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}

/* ——— Main Container ——— */
#app{
  width:100%;max-width:420px;min-height:100dvh;
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;
  padding:2.5rem 1.8rem;
}

/* ——— Tarot Card Floating ——— */
.hero-card-wrap{
  position:relative;margin-bottom:2rem;
}
.hero-card{
  width:90px;height:128px;position:relative;z-index:1;
  border-radius:10px;
  background:linear-gradient(145deg,rgba(26,21,32,.9),rgba(42,31,53,.8));
  border:1.5px solid rgba(201,169,110,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;
  box-shadow:
    0 4px 30px rgba(201,169,110,.12),
    0 1px 3px rgba(0,0,0,.3);
  animation: heroFloat 5s ease-in-out infinite;
}
.hero-card::before{
  content:'';position:absolute;inset:4px;border-radius:7px;
  border:1px solid rgba(201,169,110,.2);
}
.hero-card::after{
  content:'';position:absolute;inset:8px;border-radius:5px;
  border:.5px solid rgba(201,169,110,.1);
  border-style:dashed;
}
.hero-card-glow{
  position:absolute;inset:-15px;z-index:0;
  background:radial-gradient(ellipse at center,rgba(201,169,110,.18),transparent 70%);
  border-radius:50%;
  animation: glowPulse 3s ease-in-out infinite;
}
@keyframes heroFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}

/* ——— Star sparkles around card ——— */
.sparkle{
  position:absolute;width:3px;height:3px;
  background:var(--gold-bright);border-radius:50%;
  animation: sparkleTwinkle 2s ease-in-out infinite;
  box-shadow:0 0 6px rgba(223,188,110,.6);
}
.sparkle:nth-child(1){top:10%;left:-12px;animation-delay:0s}
.sparkle:nth-child(2){top:25%;right:-10px;animation-delay:.4s}
.sparkle:nth-child(3){bottom:20%;left:-8px;animation-delay:.8s}
.sparkle:nth-child(4){bottom:10%;right:-14px;animation-delay:1.2s}
.sparkle:nth-child(5){top:45%;left:-16px;animation-delay:1.6s}
.sparkle:nth-child(6){top:55%;right:-16px;animation-delay:.2s}
@keyframes sparkleTwinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.8)}}

/* ——— Typography ——— */
.hero-eyebrow{
  font-family:'Playfair Display',serif;
  font-size:.65rem;letter-spacing:.3em;
  color:rgba(201,169,110,.7);
  text-transform:uppercase;font-style:italic;
  margin-bottom:1rem;text-align:center;
}
.hero-title{
  font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;
  font-size:1.7rem;line-height:1.65;text-align:center;
  font-weight:400;margin-bottom:.4rem;
  color:var(--cream);
  letter-spacing:.04em;
}
.hero-title em{
  font-style:normal;color:var(--gold-bright);
  position:relative;
}
.hero-title em::after{
  content:'';position:absolute;bottom:-2px;left:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(223,188,110,.5),transparent);
}
.hero-sub{
  font-size:.82rem;color:rgba(196,122,138,.8);
  text-align:center;margin-bottom:1.8rem;
  letter-spacing:.08em;line-height:1.6;
  font-style:italic;
}

/* ——— Divider ——— */
.divider{
  width:100px;height:1px;margin:0 auto 2rem;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,.4),transparent);
  position:relative;
}
.divider::after{
  content:'◆';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:.35rem;color:rgba(201,169,110,.5);
  background:var(--deep);padding:0 8px;
}

/* ——— Three Feature Cards ——— */
.features{
  width:100%;display:flex;flex-direction:column;gap:.8rem;
  margin-bottom:2rem;
}
.feat-card{
  display:flex;align-items:flex-start;gap:.9rem;
  padding:1rem 1.1rem;
  border-radius:14px;
  border:1px solid rgba(201,169,110,.12);
  background:linear-gradient(135deg,rgba(42,31,53,.5),rgba(26,21,32,.4));
  backdrop-filter:blur(6px);
  transition:all .4s ease;
  position:relative;overflow:hidden;
}
.feat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,169,110,.04),transparent);
  opacity:0;transition:opacity .4s;
}
.feat-card:hover::before,.feat-card:active::before{opacity:1}
.feat-icon{
  width:42px;height:42px;min-width:42px;
  border-radius:50%;
  border:1px solid rgba(201,169,110,.2);
  background:rgba(26,21,32,.6);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  position:relative;
}
.feat-icon::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:.5px solid rgba(201,169,110,.1);
  animation: iconRing 4s ease-in-out infinite;
}
.feat-card:nth-child(2) .feat-icon::after{animation-delay:.8s}
.feat-card:nth-child(3) .feat-icon::after{animation-delay:1.6s}
@keyframes iconRing{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.15);opacity:.7}}

.feat-body{flex:1}
.feat-label{
  font-size:.68rem;color:rgba(201,169,110,.7);
  letter-spacing:.12em;margin-bottom:.2rem;
  font-family:'Playfair Display',serif;font-style:italic;
}
.feat-title{
  font-size:.88rem;color:var(--cream);
  margin-bottom:.3rem;font-weight:400;
  letter-spacing:.03em;
}
.feat-desc{
  font-size:.73rem;color:rgba(196,122,138,.6);
  line-height:1.6;font-style:italic;
}

/* ——— Verification Section ——— */
.access-section{
  width:100%;text-align:center;
  margin-top:.5rem;
}
.access-label{
  font-size:.68rem;color:rgba(184,160,196,.7);
  letter-spacing:.15em;margin-bottom:.8rem;
  font-family:'Playfair Display',serif;font-style:italic;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.access-label::before,.access-label::after{
  content:'';width:30px;height:.5px;
  background:linear-gradient(90deg,transparent,rgba(184,160,196,.4));
}
.access-label::after{
  background:linear-gradient(90deg,rgba(184,160,196,.4),transparent);
}

.code-input-wrap{
  display:flex;gap:.5rem;justify-content:center;margin-bottom:.7rem;
}
.code-input{
  padding:.8rem 1.2rem;border-radius:50px;
  border:1.5px solid rgba(201,169,110,.25);
  background:rgba(26,21,32,.7);
  color:var(--cream);font-size:.9rem;
  font-family:'Noto Serif SC',serif;
  text-align:center;letter-spacing:.15em;
  width:180px;outline:none;
  transition:all .3s ease;
  backdrop-filter:blur(4px);
  text-transform:uppercase;
}
.code-input::placeholder{
  color:rgba(184,160,196,.35);
  letter-spacing:.1em;font-size:.75rem;
  text-transform:none;
}
.code-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 20px rgba(201,169,110,.15);
  background:rgba(42,31,53,.7);
}
.code-input.error{
  border-color:rgba(196,122,138,.6);
  animation: shake .5s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-8px)}
  30%{transform:translateX(8px)}
  45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
  90%{transform:translateX(3px)}
}

.btn-unlock{
  padding:.8rem 1.8rem;border-radius:50px;
  border:1.5px solid var(--gold);
  background:linear-gradient(135deg,rgba(201,169,110,.15),rgba(201,169,110,.05));
  color:var(--gold-bright);font-size:.88rem;
  font-family:'Noto Serif SC',serif;letter-spacing:.1em;
  cursor:pointer;transition:all .4s ease;
  white-space:nowrap;
}
.btn-unlock:hover,.btn-unlock:active{
  background:linear-gradient(135deg,rgba(201,169,110,.25),rgba(201,169,110,.1));
  box-shadow:0 0 25px rgba(201,169,110,.2);
  transform:translateY(-1px);
}
.btn-unlock:active{transform:scale(.97)}

.code-hint{
  font-size:.62rem;color:rgba(184,160,196,.4);
  margin-top:.6rem;letter-spacing:.06em;
  font-style:italic;
}

/* ——— Author Credit ——— */
.author-section{
  margin-top:2rem;text-align:center;
}
.author-divider{
  width:60px;height:.5px;margin:0 auto .8rem;
  background:linear-gradient(90deg,transparent,rgba(184,160,196,.3),transparent);
}
.author-name{
  font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;
  font-size:.85rem;color:rgba(184,160,196,.55);
  letter-spacing:.08em;
}
.author-name .author-highlight{
  color:rgba(201,169,110,.7);
}
.author-platform{
  font-family:'Playfair Display',serif;
  font-size:.6rem;color:rgba(184,160,196,.35);
  letter-spacing:.2em;margin-top:.25rem;
  font-style:italic;
}

/* ——— Bottom decorative line ——— */
.bottom-line{
  width:100%;max-width:280px;height:.5px;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,.15),transparent);
  margin-top:1.5rem;
}

/* ——— Custom scrollbar ——— */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(201,169,110,.15);border-radius:3px}

/* ——— Mobile tweaks ——— */
@media(max-width:380px){
  .hero-title{font-size:1.4rem}
  .code-input{width:150px}
}
</style>
</head>
<body>

<!-- Ambient orbs -->
<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>
<div class="ambient-orb orb-3"></div>

<!-- Starfield Canvas -->
<canvas class="stars-canvas" id="starCanvas"></canvas>

<!-- Main App -->
<div id="app">

  <!-- Hero Card -->
  <div class="hero-card-wrap">
    <div class="hero-card-glow"></div>
    <div class="hero-card">☽</div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
  </div>

  <!-- Title -->
  <p class="hero-eyebrow">The Hidden Arcana</p>
  <h1 class="hero-title">你的灵魂深处<br>藏着哪种<em>隐秘人格</em>？</h1>
  <p class="hero-sub">一张牌，看见你从未示人的底色</p>

  <div class="divider"></div>

  <!-- Three Features -->
  <div class="features">
    <div class="feat-card">
      <div class="feat-icon">&#x2726;</div>
      <div class="feat-body">
        <div class="feat-label">FEATURE 01</div>
        <div class="feat-title">12 道灵魂之问</div>
        <div class="feat-desc">以塔罗之眼叩问内心，从灵感碎片中打捞沉睡的自我</div>
      </div>
    </div>

    <div class="feat-card">
      <div class="feat-icon">&#x269C;</div>
      <div class="feat-body">
        <div class="feat-label">FEATURE 02</div>
        <div class="feat-title">6 幅世界名画</div>
        <div class="feat-desc">每一幅经典，都是你灵魂底色的镜像——艺术从不撒谎</div>
      </div>
    </div>

    <div class="feat-card">
      <div class="feat-icon">&#x273F;</div>
      <div class="feat-body">
        <div class="feat-label">FEATURE 03</div>
        <div class="feat-title">专属塔罗解读</div>
        <div class="feat-desc">揭晓隐藏在人格面具下的真相，还有灵魂同类的影视角色推荐</div>
      </div>
    </div>
  </div>

  <!-- Verification Code -->
  <div class="access-section">
    <div class="access-label">Enter Invitation Code</div>
    <div class="code-input-wrap">
      <input
        type="text"
        class="code-input"
        id="codeInput"
        placeholder="输入邀请码"
        maxlength="20"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
      >
      <button class="btn-unlock" id="btnUnlock">&#x25B8; 进入测试</button>
    </div>
    <div class="code-hint" id="codeHint">关注小红书「薯精老师」获取邀请码</div>
  </div>

  <!-- Author Credit -->
  <div class="author-section">
    <div class="author-divider"></div>
    <div class="author-name">小红书 <span class="author-highlight">薯精老师</span> 制作</div>
    <div class="author-platform">Tarot Personality · Crafted with Soul</div>
  </div>

  <div class="bottom-line"></div>
</div>

<script>
// ============================
// Starfield Canvas
// ============================
(function(){
  const c=document.getElementById('starCanvas');
  const ctx=c.getContext('2d');
  let stars=[],w,h;

  function resize(){
    w=c.width=window.innerWidth;
    h=c.height=window.innerHeight;
  }
  resize();
  window.addEventListener('resize',resize);

  // Create stars
  const count=Math.floor((w*h)/3000);
  for(let i=0;i<count;i++){
    stars.push({
      x:Math.random()*w,
      y:Math.random()*h,
      r:Math.random()*1.2+.3,
      alpha:Math.random()*.5+.2,
      speed:Math.random()*.008+.002,
      pulse:Math.random()*Math.PI*2
    });
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    const t=Date.now()*.001;
    stars.forEach(s=>{
      const a=s.alpha+Math.sin(t*1.5+s.pulse)*.15;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(201,169,110,${Math.max(.05,a)})`;
      ctx.fill();
      // Occasional glow
      if(a>.35){
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r*2.5,0,Math.PI*2);
        ctx.fillStyle=`rgba(223,188,110,${(a-.35)*.3})`;
        ctx.fill();
      }
      s.y-=s.speed;
      if(s.y<-5){s.y=h+5;s.x=Math.random()*w}
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ============================
// Verification System
// ============================
const VALID_CODES=[
  'SOUL2026',
  'TAROT26',
  'MYSTIC',
  'PRIESTESS',
  'STARDUST'
];

const codeInput=document.getElementById('codeInput');
const btnUnlock=document.getElementById('btnUnlock');
const codeHint=document.getElementById('codeHint');

// Check if already unlocked
if(sessionStorage.getItem('tarot_unlocked')==='true'){
  window.location.href='quiz.html';
}

function verifyCode(code){
  return VALID_CODES.includes(code.toUpperCase().trim());
}

function unlock(){
  const code=codeInput.value.toUpperCase().trim();
  if(!code){
    codeInput.classList.add('error');
    codeHint.textContent='请输入邀请码';
    codeHint.style.color='rgba(196,122,138,.6)';
    setTimeout(()=>{
      codeInput.classList.remove('error');
      codeHint.textContent='关注小红书「薯精老师」获取邀请码';
      codeHint.style.color='';
    },1500);
    return;
  }
  if(verifyCode(code)){
    // Success!
    sessionStorage.setItem('tarot_unlocked','true');
    codeInput.classList.add('success');
    codeHint.textContent='✦ 灵魂之门已开启 ✦';
    codeHint.style.color='rgba(201,169,110,.7)';
    btnUnlock.textContent='进入中...';
    btnUnlock.style.pointerEvents='none';
    btnUnlock.style.opacity='.7';
    setTimeout(()=>{
      window.location.href='quiz.html';
    },800);
  }else{
    // Fail
    codeInput.classList.add('error');
    codeHint.textContent='邀请码无效，请重试';
    codeHint.style.color='rgba(196,122,138,.6)';
    codeInput.value='';
    codeInput.focus();
    setTimeout(()=>{
      codeInput.classList.remove('error');
      codeHint.textContent='关注小红书「薯精老师」获取邀请码';
      codeHint.style.color='';
    },2000);
  }
}

btnUnlock.addEventListener('click',unlock);
codeInput.addEventListener('keydown',e=>{
  if(e.key==='Enter') unlock();
});

// Focus input on load
setTimeout(()=>codeInput.focus(),1200);
</script>
</body>
</html>
